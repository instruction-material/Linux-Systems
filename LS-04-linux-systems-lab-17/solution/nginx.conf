daemon off;
master_process off;
worker_processes 1;
pid @@ROOT@@/nginx/nginx.pid;
error_log @@ROOT@@/nginx/error.log info;
events { worker_connections 32; }
http {
    access_log @@ROOT@@/nginx/access.log;
    client_body_temp_path @@ROOT@@/nginx/client-temp;
    proxy_temp_path @@ROOT@@/nginx/proxy-temp;
    fastcgi_temp_path @@ROOT@@/nginx/fastcgi-temp;
    uwsgi_temp_path @@ROOT@@/nginx/uwsgi-temp;
    scgi_temp_path @@ROOT@@/nginx/scgi-temp;
    server {
        listen 127.0.0.1:@@PROXY_PORT@@ default_server;
        server_name _;
        location / {
            proxy_pass http://127.0.0.1:@@APP_PORT@@;
            proxy_connect_timeout 1s;
            proxy_read_timeout 2s;
        }
    }
}
