name: Linux owned lab source

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  native-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install native validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y nginx shellcheck apache2-bin dbus-user-session logrotate iproute2 iputils-ping curl dnsutils coreutils util-linux
      - name: Check corrected shell source
        run: |
          shellcheck LS-05-unit-1-shell-foundations/{starter,solution}/task.sh LS-06-unit-3-users-groups-and-permissions/{starter,solution}/task.sh LS1-Personal-Lab-VM/{starter,solution}/lab_bootstrap_report.sh LS2-Static-Site-from-srv/{starter,solution}/deploy_static_site.sh LS6-Backup-Cron-and-Timer/{starter,solution}/backup_home.sh
          shellcheck LS-09-unit-7-logging-and-observability/{starter,solution}/*.sh LS-15-unit-7-logging-and-observability-supplemental-2/{starter,solution}/*.sh LS-16-unit-7-logging-and-observability-supplemental-3/{starter,solution}/*.sh
      - name: Check configuration editing shell source
        run: shellcheck LS-07-unit-4-editing-and-configuration/{starter,solution}/task.sh
      - name: Exercise actual owned Linux files and isolated serving
        run: python3 test/verify_owned_labs.py --proof output/linux-owned-labs.json
      - name: Exercise actual app, proxy headers, failure and recovery
        run: python3 test/verify_reverse_proxy.py --proof output/linux-reverse-proxy.json
      - name: Exercise actual Apache and Nginx hosts, reload and restoration
        run: python3 test/verify_apache_comparison.py --proof output/linux-apache-comparison.json
      - name: Prepare the disposable Linux user manager and journal
        run: |
          native_lab_uid=$(id -u)
          native_lab_user=$(id -un)
          native_lab_runtime=/run/user/$native_lab_uid
          sudo loginctl enable-linger "$native_lab_user"
          sudo systemctl start "user@$native_lab_uid.service"
          sudo install -d -m 2755 -o root -g systemd-journal /var/log/journal
          sudo journalctl --flush
          printf 'XDG_RUNTIME_DIR=%s\nDBUS_SESSION_BUS_ADDRESS=unix:path=%s/bus\n' "$native_lab_runtime" "$native_lab_runtime" >>"$GITHUB_ENV"
      - name: Verify actual owned user service, journal, restart and recovery
        run: python3 test/verify_systemd_service.py --proof output/linux-systemd-service.json
      - name: Verify distinct service transfer and environment drop-in labs
        run: python3 test/verify_systemd_supplemental.py --proof output/linux-systemd-supplemental.json
      - name: Verify scoped journal incidents, application timelines and actual retention
        run: python3 test/verify_logging_labs.py --proof output/linux-logging-labs.json
      - name: Verify actual configuration apply, reload, rejection and rollback
        run: python3 test/verify_editing_core.py --proof output/linux-editing-core.json
      - name: Check optional configuration editing shell source
        run: shellcheck LS-09-unit-4-editing-and-configuration-supplemental-2/{starter,solution}/task.sh LS-10-unit-4-editing-and-configuration-supplemental-3/{starter,solution}/task.sh
      - name: Verify real child environments and controlled replacement recovery
        run: python3 test/verify_editing_optional.py --proof output/linux-editing-optional.json
      - name: Verify owned processes and actual interactive Bash job control
        run: python3 test/verify_process_core.py --proof output/linux-process-core.json
      - name: Verify actual pipeline groups, statuses, zombies and adoption
        run: python3 test/verify_process_optional.py --proof output/linux-process-optional.json
      - name: Check package investigation shell source
        run: shellcheck LS-10-unit-9-package-management-and-software-layout/{starter,solution}/task.sh
      - name: Verify installed package metadata, layout and report preservation
        run: python3 test/verify_package_core.py --proof output/linux-package-core.json
      - name: Check manual and dependency lab shell source
        run: shellcheck LS-19-unit-9-package-management-and-software-layout-supplemental-2/{starter,solution}/task.sh LS-20-unit-9-package-management-and-software-layout-supplemental-3/{starter,solution}/task.sh
      - name: Verify real source builds, manual releases and isolated dpkg recovery
        run: python3 test/verify_package_optional.py --proof output/linux-package-optional.json
      - name: Check networking shell source
        run: shellcheck LS-11-unit-10-networking-from-a-systems-view/{starter,solution}/task.sh LS-21-unit-10-networking-from-a-systems-view-supplemental-2/{starter,solution}/task.sh LS-22-unit-10-networking-from-a-systems-view-supplemental-3/{starter,solution}/task.sh
      - name: Verify actual interface, socket, HTTP and DNS diagnostics
        run: python3 test/verify_network_labs.py --proof output/linux-network-labs.json
      - name: Check storage investigation shell source
        run: shellcheck LS-12-unit-12-storage-backups-and-reliability/{starter,solution}/task.sh LS-25-unit-12-storage-backups-and-reliability-supplemental-2/{starter,solution}/task.sh LS-26-unit-12-storage-backups-and-reliability-supplemental-3/{starter,solution}/task.sh
      - name: Verify actual capacity, separate restores, corruption and retention
        run: python3 test/verify_storage_labs.py --proof output/linux-storage-labs.json
      - name: Check optional shell pipeline source
        run: shellcheck LS-03-unit-1-shell-foundations-supplemental-2/{starter,solution}/task.sh LS-04-unit-1-shell-foundations-supplemental-3/{starter,solution}/task.sh
      - name: Verify literal filename streams and original pipeline failures
        run: python3 test/verify_shell_optional.py --proof output/linux-shell-optional.json
      - name: Check filesystem observation shell source
        run: shellcheck LS-05-unit-2-filesystem-hierarchy-and-directory-purpose-supplemental-2/{starter,solution}/task.sh LS-06-unit-2-filesystem-hierarchy-and-directory-purpose-supplemental-3/{starter,solution}/task.sh
      - name: Verify actual logical paths and live filesystem reads
        run: python3 test/verify_filesystem_optional.py --proof output/linux-filesystem-optional.json
      - name: Check optional permission experiment shell source
        run: shellcheck LS-07-unit-3-users-groups-and-permissions-supplemental-2/{starter,solution}/task.sh LS-08-unit-3-users-groups-and-permissions-supplemental-3/{starter,solution}/task.sh
      - name: Verify actual unlink permissions and creation masks
        run: python3 test/verify_permissions_optional.py --proof output/linux-permissions-optional.json
      - name: Check setup continuation shell source
        run: |
          shellcheck LS-01-ls0-setup-and-tooling-supplemental-2/{starter,solution}/task.sh LS-01-ls0-setup-and-tooling-supplemental-2/{starter,solution}/tools/*/*.sh
          shellcheck LS-02-ls0-setup-and-tooling-supplemental-3/{starter,solution}/*.sh
      - name: Verify actual tool lookup, execution failures and interpreter arguments
        run: python3 test/verify_setup_optional.py --proof output/linux-setup-optional.json
      - name: Check scheduling continuation shell source
        run: shellcheck LS-17-unit-8-scheduling-and-automation-supplemental-2/{starter,solution}/task.sh LS-18-unit-8-scheduling-and-automation-supplemental-3/{starter,solution}/task.sh
      - name: Verify actual calendar forecasts and owned repeating timers
        run: python3 test/verify_scheduling_optional.py --proof output/linux-scheduling-optional.json
      - name: Check web investigation shell source
        run: shellcheck LS-23-unit-11-web-servers-supplemental-2/{starter,solution}/task.sh LS-24-unit-11-web-servers-supplemental-3/{starter,solution}/task.sh
      - name: Verify actual host defaults and conditional HTTP representations
        run: python3 test/verify_web_optional.py --proof output/linux-web-optional.json
      - name: Check deployment studio shell source
        run: shellcheck LS-01-linux-systems-lab-14/{starter,solution}/task.sh LS-27-applied-studio-14-linux-systems-lab-14-supplemental-2/{starter,solution}/task.sh LS-28-applied-studio-14-linux-systems-lab-14-supplemental-3/{starter,solution}/task.sh
      - name: Verify actual release rollback, payload integrity and publisher locks
        run: python3 test/verify_deployment_studio.py --proof output/linux-deployment-studio.json
      - name: Check required operations capstone shell source
        run: shellcheck LS-04-linux-systems-lab-17/{starter,solution}/task.sh
      - name: Verify actual capstone identity, manager, timer, proxy and restore
        run: python3 test/verify_operations_capstone.py --proof output/linux-operations-capstone.json
      - name: Retain native source acceptance
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: linux-owned-labs-source
          path: output/
          if-no-files-found: error
          retention-days: 14
