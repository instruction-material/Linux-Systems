<VirtualHost *:80>
	ServerName linux-systems.local
	ServerAdmin webmaster@localhost
	DocumentRoot /srv/linux-systems-apache
	ErrorLog ${APACHE_LOG_DIR}/linux-systems.error.log
	CustomLog ${APACHE_LOG_DIR}/linux-systems.access.log combined

	<Directory /srv/linux-systems-apache>
		Require all granted
		Options -Indexes +FollowSymLinks
		AllowOverride None
	</Directory>
</VirtualHost>
